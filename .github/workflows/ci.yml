name: CI

on:
    push:
        branches: ['main', 'develop']
    pull_request:
        branches: ['main', 'develop']

jobs:
    lint:
        runs-on: ubuntu-latest
        container:
            image: node:26-alpine
        steps:
            - uses: actions/checkout@v4
            - uses: ./.github/actions/setup-and-build
            - name: Run linting
              run: pnpm run lint

    test:
        runs-on: ubuntu-latest
        container:
            image: node:26-alpine
        steps:
            - uses: actions/checkout@v4
            - uses: ./.github/actions/setup-and-build
            - name: Run tests
              run: pnpm run test

    integration:
        runs-on: ubuntu-latest
        container:
            image: node:26-alpine
        needs: [lint, test]
        steps:
            - name: Install bash and curl
              run: apk add --no-cache bash curl
            - uses: actions/checkout@v4
            - uses: ./.github/actions/setup-and-build
            - name: Run integration tests
              run: pnpm run test:integration

    e2e:
        runs-on: ubuntu-latest
        needs: [lint, test]
        # Pinned to the Playwright image so CI renders screenshots identically to
        # the committed Linux baselines (e2e/specs/*-snapshots). The image ships
        # Node 24 (satisfies engines >=24) and the browsers, so no separate
        # setup-node or `playwright install` step is needed. Keep the tag in sync
        # with @cohbrgr/e2e's @playwright/test version.
        container:
            image: mcr.microsoft.com/playwright:v1.61.1-noble
        steps:
            - uses: actions/checkout@v4
            - uses: ./.github/actions/setup-and-build
            - name: Run e2e tests
              run: pnpm run test:e2e

    lighthouse:
        runs-on: ubuntu-latest
        container:
            image: node:26-alpine
        needs: [lint, test]
        steps:
            - uses: actions/checkout@v4
            - name: Install Chromium
              run: apk add --no-cache chromium
            - uses: ./.github/actions/setup-and-build
            - name: Run Lighthouse CI
              env:
                  LHCI_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  npm install -g @lhci/cli
                  lhci autorun
